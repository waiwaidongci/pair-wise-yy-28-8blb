<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>影视拍摄连续性</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f3f4f7}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #aaa;border-radius:6px}button{background:#4b2d6f;color:#fff}button.sec{background:#6b5b7e}button.warn{background:#b0413e}pre{white-space:pre-wrap;max-height:420px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}.order{font-family:monospace;background:#eef}table{border-collapse:collapse;width:100%;margin:6px 0}th,td{border:1px solid #ccc;padding:4px 8px;text-align:left}th{background:#efe}.voided{color:#999;text-decoration:line-through}.conflict-open{color:#b0413e}.conflict-resolved{color:#888}.conflict-exempted{color:#a67c00}.reqid{font-family:monospace;color:#4b2d6f;font-weight:bold}.retrybar{background:#fff3cd;border:1px solid #ffe08a;padding:8px;border-radius:6px;margin:6px 0}</style><h1>影视拍摄连续性管理</h1><section><h2>连续性报告</h2><input id="production" type="number" placeholder="项目 ID"><button onclick="report()">查看报告</button><div id="report"></div></section><section><h2>当前叙事顺序</h2><div id="order"></div></section><section><h2>写入与重试</h2><p>请求编号（同一请求重试时沿用，不重复写入）：<span id="reqid" class="reqid"></span> <button class="sec" onclick="newReqId()">换一个请求编号</button></p><div class="retrybar" id="retrybar" style="display:none">写入失败：<span id="retryerr"></span> <button class="warn" onclick="retryLast()">沿用同一请求编号重试</button></div></section><section><h2>状态与冲突</h2><div class="grid"><input id="scene" type="number" placeholder="场次 ID"><input id="shot" type="number" placeholder="镜头 ID"><input id="element" type="number" placeholder="元素 ID"><input id="user" type="number" placeholder="场记/制片 ID"><input id="version" type="number" placeholder="打开编辑时镜头版本号"><input id="value" placeholder="状态值"><input id="numeric" type="number" step="0.1" placeholder="数值"><input id="conflict" type="number" placeholder="冲突 ID"><input id="reviewer" type="number" placeholder="审片人 ID"><input id="reason" placeholder="理由"></div><button onclick="state()">设置状态并检测</button><button onclick="check()">重新检查场次</button><button onclick="lock()">锁定镜头</button><button onclick="exempt()">批准豁免</button><pre id="result"></pre></section><section><h2>镜头调序（位置变化后重算冲突）</h2><div class="grid"><input id="rshot" type="number" placeholder="镜头 ID"><input id="rorder" type="number" placeholder="新叙事顺序"><input id="rversion" type="number" placeholder="打开编辑时镜头版本号"><input id="ruser" type="number" placeholder="场记/制片 ID"></div><button onclick="reorder()">调整叙事顺序</button><pre id="rresult"></pre></section><section><h2>调整方案</h2><input id="newvalue" placeholder="新状态"><input id="newnumeric" type="number" step="0.1" placeholder="新数值"><button onclick="propose()">提出方案</button><input id="plan" type="number" placeholder="方案 ID"><button onclick="approve()">批准方案</button><pre id="extra"></pre></section><script>
const show=(e,x)=>document.querySelector(e).textContent=JSON.stringify(x,null,2);
let requestId=crypto.randomUUID();
function newReqId(){requestId=crypto.randomUUID();document.querySelector('#reqid').textContent=requestId;}
document.querySelector('#reqid').textContent=requestId;
let lastAction=null;
function showRetry(err){document.querySelector('#retrybar').style.display='block';document.querySelector('#retryerr').textContent=err;}
function clearRetry(){document.querySelector('#retrybar').style.display='none';lastAction=null;}
async function get(u,e='#result'){clearRetry();try{const r=await fetch(u);const x=await r.json();show(e,x);if(!r.ok)showRetry(x.error||('HTTP '+r.status));return x;}catch(err){showRetry(String(err));throw err;}}
async function post(u,b,e='#result'){clearRetry();const payload={...b,request_id:requestId};lastAction=()=>post(u,b,e);try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const x=await r.json();show(e,x);if(!r.ok){showRetry(x.error||('HTTP '+r.status));}else{clearRetry();}return x;}catch(err){showRetry(String(err));throw err;}}
function retryLast(){if(lastAction)lastAction();}
function report(){get('/api/productions/'+production.value+'/continuity','#report').then(renderOrder);}
function renderOrder(r){const el=document.querySelector('#order');if(!r||!r.scenes){el.textContent='';return;}let html='';for(const sc of r.scenes){html+='<h3>'+sc.scene_number+' · '+sc.title+'</h3>';html+='<table><tr><th>叙事顺序</th><th>镜头编号</th><th>拍摄顺序</th><th>状态</th><th>版本</th></tr>';for(const sh of sc.shots){html+='<tr class="order"><td>'+sh.narrative_order+'</td><td>'+sh.shot_code+'</td><td>'+sh.shoot_order+'</td><td>'+sh.status+'</td><td>'+sh.version+'</td></tr>';}html+='</table>';}el.innerHTML=html;}
function state(){post('/api/shots/'+shot.value+'/states',{element_id:+element.value,state_value:value.value,numeric_value:numeric.value?+numeric.value:null,note:reason.value,user_id:+user.value,version:version.value?+version.value:null})}
function check(){post('/api/scenes/'+scene.value+'/check',{})}
function lock(){post('/api/shots/'+shot.value+'/lock',{user_id:+user.value,version:version.value?+version.value:null})}
function exempt(){post('/api/conflicts/'+conflict.value+'/exemptions',{reason:reason.value,reviewer_id:+reviewer.value})}
function reorder(){post('/api/shots/'+rshot.value+'/reorder',{narrative_order:+rorder.value,user_id:+ruser.value,version:rversion.value?+rversion.value:null},'#rresult')}
function propose(){post('/api/conflicts/'+conflict.value+'/plans',{new_value:newvalue.value,numeric_value:newnumeric.value?+newnumeric.value:null,reason:reason.value,user_id:+user.value})}
function approve(){post('/api/plans/'+plan.value+'/review',{approve:true,reviewer_id:+reviewer.value,note:reason.value},'#extra')}
report();
</script></html>
